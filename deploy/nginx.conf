# Serve the build at the root of a dedicated domain or subdomain.
# Replace fingertip.example.com with your real domain before installing.
# Nginx's main http block must include its standard mime.types file.
server {
    listen 80;
    server_name fingertip.example.com;

    root /var/www/fingertip;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Revalidate HTML and unversioned public files on each visit.
    add_header Cache-Control "no-cache";

    # Vite gives generated assets content hashes in their filenames.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
